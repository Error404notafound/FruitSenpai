name: Gerar APK FruitSenpai

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar pasta www automaticamente
        run: |
          mkdir -p www
          cp index.html www/
          cp *.png www/ 2>/dev/null || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor e criar projeto Android
        run: |
          npm install
          npx cap init "FruitSenpai" "com.fruitsenpai.app" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Dar permissão e compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FruitSenpai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
