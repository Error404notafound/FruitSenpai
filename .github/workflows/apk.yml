name: Gerar APK FruitSenpai

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar pasta www e ícone
        run: |
          mkdir -p www assets
          cp index.html www/
          sed -i 's/signInWithPopup/signInWithRedirect/g' www/index.html
          cp 20261001_022059.png www/
          cp 20261001_022059.png assets/icon.png
          cp 20261001_022059.png assets/splash.png

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor e gerar ícone oficial
        run: |
          npm install
          npm install -D @capacitor/assets
          npx cap init "FruitSenpai" "com.fruitsenpai.app" --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FF0000' --splashBackgroundColor '#000000'

      - name: Configurar HTTPS, Login e Permissões de Microfone
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.fruitsenpai.app",
            "appName": "FruitSenpai",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "overrideUserAgent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
            }
          }
          EOF

          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|g' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Dar permissão e compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FruitSenpai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
